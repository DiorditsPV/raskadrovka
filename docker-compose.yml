services:
  panel:
    build: .
    container_name: raskadrovka-panel
    # Порт открыт только петле хозяина. У панели нет аутентификации: любой, кто дотянется
    # до неё, запускает задания и тратит ваш аккаунт. Открывать наружу — только вместе
    # с проверкой доступа, которой пока нет.
    ports:
      - "127.0.0.1:8770:8770"
    volumes:
      # Репозиторий одним томом. Именно одним: страховка дерева раскладывает жёсткие
      # ссылки на чужие файлы внутрь `cache/panel/guard/`, а жёсткая ссылка не пересекает
      # границу файловой системы — два отдельных монтирования её сломают.
      - .:/work

      # Ключ Codex. Единственное, что берётся с хоста: он файловый, и без него оператор
      # не войдёт. Каталог монтируется целиком, потому что codex обновляет `auth.json`
      # заменой файла — отдельный bind на файл после первого же обновления отвалится.
      # Цена названа честно: контейнер видит и историю сессий Codex, и его картинки.
      # Хотите теснее — смонтируйте только `auth.json` и `config.toml` и обновляйте вход
      # руками, когда протухнет.
      - ${HOME}/.codex:/root/.codex

      # У Claude Code ключи лежат в Связке ключей macOS, а не в файле, и смонтировать их
      # в Linux нельзя. Поэтому здесь свой том: вход делается один раз внутри контейнера
      #     docker compose exec panel claude
      # и переживает перезапуски. Домашний `~/.claude` не монтируем нарочно: там история
      # всех ваших проектов, и контейнеру она не нужна.
      - claude-home:/root/.claude

    environment:
      # Часы заданий и даты в интерфейсе должны совпадать с вашими.
      - TZ=${TZ:-Europe/Moscow}
    restart: unless-stopped

volumes:
  claude-home:
