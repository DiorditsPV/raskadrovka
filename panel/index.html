<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Панель управления «Раскадровки»: книга проходит путь до иллюстраций — разбор, библия и листы персонажей, карточки сцен, кадры.">
<title>Раскадровка — панель</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232c4a66'/%3E%3Crect x='3' y='4.5' width='10' height='7' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#eef0f3; --surface:#ffffff; --raised:#e3e7ec; --line:#cfd5dc; --line-soft:#e2e6eb;
  --text:#171b20; --muted:#59636e; --dim:#676e76;
  --accent:#2c4a66; --accent-deep:#1f3649; --accent-soft:#e3ebf2; --accent-line:#bfd0df;
  --read:#eaf0f5; --read-line:#cdd9e3;
  --ok:#2a7b44; --ok-soft:#e4f2e8; --ok-line:#bfe0ca; --ok-solid:#378550;
  --warn:#c48a00; --bad:#c2213f; --run:#166f89;
  --on-slate:#b3bec8;      /* 4.5:1 с запасом; #acb7c1 давал 4.52 — ровно на пороге */
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  --display:"Unbounded","IBM Plex Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
/* Шкала кеглей одна на всю панель: 12 13 14 16 18 24. Каждое лишнее целое между ними —
   не оттенок смысла, а шум, который мешает сканировать плотный экран. */
*{box-sizing:border-box}
html{color-scheme:light;background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* На сланцевой боковине акцентная обводка совпадает с фоном и фокус пропадает — там белая. */
.rail :focus-visible{outline-color:#fff}
img{display:block;max-width:100%}
h1{font:500 24px/1.2 var(--display);margin:0 0 6px;letter-spacing:-.005em}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
h2{font:600 16px/1.3 var(--sans);margin:0}
code,.mono{font-family:var(--mono)}
/* Текст только для чтения с экрана: имя кнопки собирается из её содержимого, а не
   подменяется aria-label — подменённое имя расходится с видимой надписью. */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-weight:500;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.5;cursor:default}
.btn[disabled]:hover{background:var(--surface)}
.btn-primary{background:var(--accent);border-color:var(--accent-deep);color:#fff}
.btn-primary:hover{background:var(--accent-deep)}
.btn-sm{padding:5px 10px;font-size:13px}

/* Ширины колонок — переменные: на узком окне двигается только они, а не вся раскладка. */
.app{--rail:248px; --queue:296px;
  display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--queue);
  /* Без потолка: на экране 2560 колпак 1720 оставлял по 420 px пустоты с каждой стороны,
     а место нужнее всего картинкам. Длину строки держит не окно, а сам текст (64ch). */
  grid-template-rows:52px 1fr;grid-auto-rows:auto;min-height:100vh;
  border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);
  background:linear-gradient(to right,#2c4a66 0 var(--rail),var(--surface) var(--rail) calc(100% - var(--queue)),var(--ground) calc(100% - var(--queue)))}
.top{grid-column:1/-1;display:flex;align-items:center;gap:28px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.brand{font:500 16px/1 var(--display);letter-spacing:-.01em}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{padding:7px 13px;border-radius:5px;color:var(--muted);font-weight:500}
.tab:hover{background:var(--ground)}
.tab[aria-current]{background:var(--accent-soft);color:var(--accent-deep)}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok-solid)}
.dot.busy{background:var(--run)}

.rail,.queue{position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px);overflow:auto}
.rail{background:#2c4a66;color:#e8edf2;padding:20px 0}
.rail .kicker{color:var(--on-slate);font-size:12px;letter-spacing:.09em;text-transform:uppercase;padding:0 18px 8px}
.rail .book{padding:0 18px 18px}
.rail .book-name{font:500 16px/1.25 var(--display)}
.rail .book-sub{color:var(--on-slate);font-size:13px;margin-top:4px}
.stage{display:flex;align-items:center;gap:12px;width:100%;padding:11px 18px;color:inherit}
.stage:hover{background:#3a5872}
.stage[aria-current]{background:#f6f8fb;color:var(--text)}
.stage[aria-current] .stage-sub{color:var(--muted)}
.mark{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:12px;color:#ccd5de}
.stage[aria-current] .mark{background:var(--accent);border-color:var(--accent);color:#fff}
.stage.done .mark{background:var(--ok-solid);border-color:var(--ok-solid);color:#fff}
/* Начатый, но не пройденный этап: кольцо зелёное, номер на месте. Галочка приберегается
   для настоящего гейта, иначе она перестаёт что-либо означать. */
.mark.part{border-color:var(--ok-solid);border-width:2px;color:#fff}
.stage-name{display:block;font-weight:500}
.stage-sub{display:block;font-size:13px;color:var(--on-slate);margin-top:1px}
.rail .note{margin:18px 18px 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.16);color:var(--on-slate);font-size:13px;line-height:1.5}
.rail .note b{color:#a8dcba;font-weight:500}

/* min-height, чтобы страница не подскакивала, когда заглушку сменяет содержимое:
   документ сразу занимает свою высоту, а не растёт с одной строки до экрана. */
.work{padding:26px 30px 60px;box-shadow:-1px 0 0 var(--line),1px 0 0 var(--line);min-width:0;min-height:calc(100vh - 52px)}
.lede{color:var(--muted);max-width:64ch;margin:0 0 22px}
.step{border-top:1px solid var(--line-soft);padding:20px 0}
.step:first-of-type{border-top:0}
.step-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:500;margin-top:1px}
.step-sub{color:var(--muted);font-size:13px;margin-top:2px;max-width:64ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:14px 15px}
.card h2{margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px}
.card.on{border-color:var(--accent-line);background:var(--accent-soft)}
.kv{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.kv b{color:var(--text);font-weight:500}

/* Широкое содержимое прокручивается внутри себя, а не выталкивает соседнюю колонку. */
.wide{overflow-x:auto}
/* Ширину без потолка получают картинки, а не таблица: растянутая на 2500 px, она разносит
   колонки так, что строку приходится читать поворотом головы. */
table{border-collapse:collapse;width:100%;min-width:600px;max-width:1180px;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:hover td{background:#fafbfc}
.name{font:500 14px/1.3 var(--display)}

.audit{display:inline-flex;gap:3px;vertical-align:middle}
.cell{width:12px;height:12px;border:1px solid var(--line);border-radius:2px;background:var(--surface)}
.cell.full{background:var(--accent);border-color:var(--accent)}
.cell.half{background:linear-gradient(135deg,var(--warn) 0 50%,var(--surface) 50% 100%);border-color:var(--warn)}
.score{margin-left:9px;font-weight:500}
@media (forced-colors: active){
  /* Иначе система перекрасит клетки в один цвет и полоса аудита перестанет что-либо значить. */
  .cell{forced-color-adjust:none}
}

.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.tag.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.tag.bad{background:#fdecef;border-color:#f2c3cd;color:var(--bad)}
.tag.run{background:#e3f2f7;border-color:#bcdfe9;color:var(--run)}
.tag.wait{background:var(--raised)}
.why{color:var(--bad);font-size:12px;margin-top:5px;line-height:1.45}
/* Причина штатного события — не беда: красным здесь красить нечего. */
.why.quiet{color:var(--muted)}

.queue{background:var(--ground);padding:20px 18px}
.queue h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.queue-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.job{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:10px 12px;margin-bottom:8px}
.job-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.job-kind{font-weight:500}
/* Перенос по дефисам, а не посреди слова: номер задания читают глазами, «…-dag / o» не читается. */
.job-id{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:3px;overflow-wrap:break-word}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
/* tabindex у лога не для клика: прокручиваемая область без фокусируемого содержимого
   с клавиатуры недостижима, а лог — единственное окно в идущее задание. */
.log{font-family:var(--mono);font-size:12px;line-height:1.5;background:var(--read);border:1px solid var(--read-line);border-radius:5px;padding:9px 10px;margin-top:8px;max-height:190px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--muted);font-size:13px;padding:12px 0;line-height:1.5;max-width:46ch}
.err{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border:1px solid #f2c3cd;background:#fdecef;color:#8d1b31;border-radius:6px;padding:10px 12px;margin-bottom:16px;font-size:13px}
.err .btn{background:transparent;border-color:#e2aab6;color:#8d1b31}
.wide-log{max-height:none;height:min(58vh,560px);font-size:13px}
.job.now{border-color:var(--accent-line);box-shadow:inset 3px 0 0 var(--accent)}
.job-what{font-size:13px;color:var(--muted);margin-top:2px}
.skeleton{color:var(--dim);font-size:13px;padding:20px 0}
.rail-skeleton{min-height:420px}
.refs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
/* Эталон — единственное доказательство манеры. В 94 px это уменьшение в шестнадцать раз:
   манеры там не видно, а выбирают направление именно по ней. */
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.refs img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.styles-list{display:grid;gap:14px}
.style-head{display:flex;justify-content:space-between;align-items:baseline;gap:18px;flex-wrap:wrap}
.style-head .notes{margin:0;max-width:78ch}
.notes{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.5}

/* Лист несёт три проекции. Полоской в 50 px их было не разглядеть — показываем целиком. */
.sheet{width:210px;height:auto;aspect-ratio:3/2;object-fit:cover;border:1px solid var(--line);border-radius:5px;background:var(--raised)}
.sheet-none{width:210px;height:140px;border:1px dashed var(--line);border-radius:5px;display:grid;place-items:center;color:var(--dim);font-size:12px}
.who{display:flex;align-items:center;gap:12px}
.who .name{white-space:nowrap}

.scene{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,540px);gap:26px;border-top:1px solid var(--line-soft);padding:22px 0}
/* Кадр должен быть виден целиком и в подробностях, но не растекаться на сверхшироком
   экране: за 1300 px одна картинка перестаёт помещаться в поле зрения. */
.frames{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-content:start;max-width:1300px}
.frame img{width:100%;height:auto;aspect-ratio:3/2;border:1px solid var(--line);border-radius:5px;background:var(--raised)}
.frame-label{font-weight:500;margin-bottom:7px}
.gaps{font-size:12px;color:var(--muted);margin-top:5px}
.frame .under{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.frame-none{border:1px dashed var(--line);border-radius:5px;min-height:150px;display:grid;place-items:center;padding:20px;text-align:center;color:var(--dim);font-size:13px}
.scene h2{font:500 18px/1.25 var(--display);margin-bottom:4px}
.scene .cap{color:var(--muted);margin-bottom:10px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.excerpt{background:var(--read);border:1px solid var(--read-line);border-radius:5px;padding:11px 13px;font-size:13px;line-height:1.55;margin-top:10px}
.excerpt .from{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:6px}
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.whos{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.whos figure{margin:0;text-align:center;width:132px}
.whos img{width:132px;height:auto;aspect-ratio:3/2;object-fit:cover;border:1px solid var(--line);border-radius:5px}
.whos figcaption{font-size:12px;color:var(--muted);margin-top:3px}

@media (max-width:1400px){ .app{--rail:216px; --queue:264px} .work{padding:24px 22px 60px} }
@media (max-width:1300px){
  /* Очередь уходит вниз во всю ширину: рабочей колонке место нужнее, чем ей. */
  .app{--rail:200px;grid-template-columns:var(--rail) minmax(0,1fr);
       background:linear-gradient(to right,#2c4a66 0 var(--rail),var(--surface) var(--rail))}
  /* Не 1/-1: боковина липкая и накрыла бы первую карточку очереди собой. */
  .queue{grid-column:2/-1;position:static;max-height:none;border-top:1px solid var(--line)}
  .queue .jobs{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .job{margin-bottom:0}
  .scene{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  /* Одна колонка. Обязательно сбросить grid-column у очереди: с прежним «2/-1» она
     заводит вторую колонку, и боковина схлопывается в нулевую ширину. */
  .app{grid-template-columns:minmax(0,1fr);background:var(--surface)}
  .rail,.work,.queue{grid-column:1/-1}
  .rail{position:static;max-height:none;padding-bottom:14px}
  .work{box-shadow:none;padding:22px 18px 48px}
  .queue{padding:18px}
  .top{gap:12px;overflow-x:auto}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <span class="brand">Раскадровка</span>
    <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
    <span class="status" role="status"><span class="dot" id="dot" aria-hidden="true"></span><span id="statusText">панель готова</span></span>
  </header>
  <nav class="rail" id="rail" aria-label="Книга и этапы"></nav>
  <main class="work" id="work"></main>
  <aside class="queue" aria-label="Задания"><h2>Задания</h2><div class="jobs" id="jobs"></div></aside>
</div>

<script>
const state = {screen: 'books', slug: null, books: [], book: null, styles: [], jobs: [],
               batch: null, openLog: null, wideLog: null, error: null, ready: false,
               total: 0, settings: null, git: null, showAll: false};

const SCREENS = [
  ['books', 'Книги', 'приём и разбор'],
  ['characters', 'Персонажи', 'библия и листы'],
  ['batches', 'Партии', 'карточки и кадры'],
  ['styles', 'Стили', 'направления и эталоны'],
];

const KIND_NAMES = {'ingest': 'разбор книги', 'index': 'индекс лиц и сцен',
  'bible-entry': 'запись в библию', 'sheet': 'лист персонажа', 'scene-card': 'карточка сцены',
  'prompt': 'промпт сцены', 'scene': 'кадр сцены', 'register': 'регистрация партии',
  'styles-page': 'страница стилей'};
const STATUS_NAMES = {queued: 'в очереди', running: 'идёт', done: 'готово',
  failed: 'не прошло', cancelled: 'снято', interrupted: 'прервано'};
// Метка статуса: `interrupted` — не авария. Спека прямо называет перезапуск панели обычным
// делом, и красная плашка на штатном событии обесценивает красный там, где он нужен.
const STATUS_TAGS = {done: 'ok', failed: 'bad', running: 'run', queued: 'wait',
  cancelled: 'wait', interrupted: 'wait'};
const FIELD_NAMES = {name: 'имя', appearance: 'описание', appearance_en: 'описание для промпта',
  locators: 'локаторы', understanding: 'балл', audit: 'аудит', sheet: 'лист',
  sheet_sha256: 'хеш листа', sheet_prompt: 'промпт листа'};

const AUDIT_KEYS = ['age','build','face','eyes','hair','skin','clothing','gear','marks','bearing'];
const AUDIT_NAMES = {age:'возраст', build:'сложение', face:'лицо', eyes:'глаза', hair:'волосы',
                     skin:'кожа', clothing:'одежда', gear:'экипировка', marks:'приметы',
                     bearing:'осанка'};
const OPEN = ['queued', 'running'];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Обрезка по границе слова: «…carries every lit surfac» читается как опечатка, а не как срез.
function clip(text, n) {
  if (!text || text.length <= n) return text || '';
  const cut = text.slice(0, n);
  const space = cut.lastIndexOf(' ');
  return (space > n * 0.6 ? cut.slice(0, space) : cut) + '…';
}

async function api(path, options) {
  const answer = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...options});
  const data = await answer.json().catch(() => ({error: 'ответ не разобрался'}));
  if (!answer.ok) throw new Error(data.error || answer.statusText);
  return data;
}

async function load() {
  try {
    state.books = (await api('/api/books')).books;
    if (!state.slug && state.books.length) state.slug = state.books[0].slug;
    if (state.slug) state.book = await api('/api/books/' + state.slug);
    if (!state.styles.length) state.styles = (await api('/api/styles')).styles;
    if (state.batch) state.batch = await api(
      `/api/books/${encodeURIComponent(state.slug)}/batches/${encodeURIComponent(state.batch.name)}`);
    if (!state.settings) state.settings = await api('/api/settings');
    state.git = await api('/api/git');
  } catch (error) { state.error = error.message; }
  state.ready = true;
  canonical();
  draw();
  // Имена героев в очереди приходят вместе с книгой: без этого они минуту стоят ключами.
  drawJobs();
}

// — часы заданий —

const seconds = iso => Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));

function clock(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  const mm = String(m % 60).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return m >= 60 ? `${Math.floor(m / 60)}:${mm}:${ss}` : `${m}:${ss}`;
}

function tick() {
  // Часы бегущего задания обновляются на месте, без пересборки очереди: иначе открытый
  // лог мигал бы раз в секунду.
  for (const el of document.querySelectorAll('[data-since]')) {
    el.textContent = 'идёт ' + clock(seconds(el.dataset.since));
  }
}

function spent(job, place) {
  if (job.status === 'running' && job.started) {
    // Часы без знаменателя не отвечают на вопрос «это половина пути или конец?».
    const cap = state.settings ? ` из ${clock(state.settings.timeout)} до таймаута` : '';
    return `<div class="clock"><span data-since="${esc(job.started)}">идёт ${
      clock(seconds(job.started))}</span>${esc(cap)}</div>`;
  }
  if (job.status === 'queued')
    return `<div class="clock">ждёт очереди${place ? `, ${place}-е по счёту` : ''} · задания идут по одному</div>`;
  if (job.started && job.finished) {
    const sec = Math.max(0, Math.round((new Date(job.finished) - new Date(job.started)) / 1000));
    const tries = (job.result && job.result.tries || []).length;
    return `<div class="clock">шло ${clock(sec)} · кончилось ${esc(job.finished.slice(11))}${
      tries > 1 ? ` · попыток ${tries}` : ''}</div>`;
  }
  return '<div class="clock">ещё не начиналось</div>';
}

function jobSubject(job) {
  const key = job.args && (job.args.key || job.args.id || job.args.batch);
  if (!key) return null;
  const hero = ((state.book && state.book.characters) || []).find(c => c.key === key);
  return hero ? hero.name : key;
}

function openEntryJob(key) {
  return state.jobs.find(j => j.kind === 'bible-entry' && j.args
                              && j.args.key === key && OPEN.includes(j.status));
}

async function pollJobs() {
  if (document.hidden) return;          // вкладка не на виду — сервер дёргать незачем
  try {
    const answer = await api('/api/jobs?limit=12');
    const fresh = answer.jobs;
    state.total = answer.total || fresh.length;
    // Задание кончилось — значит, в репозитории что-то изменилось: перечитываем рабочую
    // колонку, иначе после «Собрать запись» экран остаётся вчерашним до смены вкладки.
    const was = new Set(state.jobs.filter(j => OPEN.includes(j.status)).map(j => j.id));
    const finished = fresh.some(j => was.has(j.id) && !OPEN.includes(j.status));
    const before = state.jobs.filter(j => OPEN.includes(j.status)).map(j => j.id).join();
    state.jobs = fresh;
    drawJobs();
    const busy = fresh.some(j => j.status === 'running');
    document.getElementById('dot').className = 'dot' + (busy ? ' busy' : '');
    document.getElementById('statusText').textContent = busy ? 'Codex работает' : 'панель готова';
    if (finished) return load();
    // Состав идущих заданий изменился — кнопки на экране должны это показать.
    if (before !== fresh.filter(j => OPEN.includes(j.status)).map(j => j.id).join()) draw();
  } catch (error) { /* сервер мог уйти — молча ждём следующего круга */ }
}

// Экран живёт в адресе. Без этого вкладка «Партии» изнутри партии ничего не делала (меняла
// state.screen на тот же самый), перезагрузка всегда сбрасывала на «Книги», а сослаться на
// экран было нечем.
// Книга — часть адреса. «Персонажи» без книги — вопрос без ответа: чьи это персонажи,
// понять неоткуда, а ссылка на экран означала бы разное в разное время.
function href(screen, batch) {
  if (screen === 'books' || !state.slug) return '#/books';
  return '#/' + encodeURIComponent(state.slug) + '/' + screen
       + (batch ? '/' + encodeURIComponent(batch) : '');
}
function go(screen) { location.hash = href(screen, null); }
function openBatch(name) { location.hash = href('batches', name); }

function applyHash(first) {
  const parts = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/').filter(Boolean);
  const known = key => SCREENS.some(([k]) => k === key);
  let slug = null, screen = 'books', want = null;
  if (known(parts[0])) {                       // старая ссылка без книги — берём текущую
    screen = parts[0];
    want = screen === 'batches' && parts[1] ? parts[1] : null;
  } else if (parts.length) {
    slug = parts[0];
    screen = known(parts[1]) ? parts[1] : 'books';
    want = screen === 'batches' && parts[2] ? parts[2] : null;
  }
  const swap = slug && slug !== state.slug;
  if (slug) state.slug = slug;
  const had = state.batch ? state.batch.name : null;
  state.screen = screen;
  if (first === true || swap || want !== had) {
    state.batch = want ? {name: want} : null;
    return load();
  }
  canonical();     // ссылка без книги выправляется в полную, иначе она снова станет двусмысленной
  draw();
}

function canonical() {
  // После загрузки книга известна: приводим адрес к полному виду, чтобы ссылка была
  // однозначной и после перезагрузки открывала то же самое.
  const want = href(state.screen, state.batch ? state.batch.name : null);
  if (location.hash !== want) history.replaceState(null, '', want);
}

function drawTabs() {
  document.getElementById('tabs').innerHTML = SCREENS
    .map(([key, name]) => `<button class="tab" data-go="${key}"${
      state.screen === key ? ' aria-current="page"' : ''}>${name}</button>`)
    .join('');
}

function stages() {
  // Этап считается пройденным по гейту, а не по непустоте. «Один лист из восьми» — это
  // начатый этап, а не пройденный; галочка на нём обесценивает все остальные галочки.
  const book = state.books.find(b => b.slug === state.slug);
  const batches = (state.book && state.book.batches) || [];
  const shot = batches.filter(b => b.cards > 0 && b.scenes >= b.cards).length;
  const chars = book ? book.characters : 0, sheets = book ? book.sheets : 0;
  return {
    books: {done: !!(book && book.parsed && book.indexed), started: !!book,
            note: !book ? 'книг нет' : !book.parsed ? 'не разобрана'
                  : book.indexed ? 'разобрана, индекс есть' : 'разобрана, индекса нет'},
    characters: {done: chars > 0 && sheets === chars, started: sheets > 0,
                 note: chars ? `листов ${sheets} из ${chars}` : 'записей нет'},
    batches: {done: batches.length > 0 && shot === batches.length, started: batches.length > 0,
              note: batches.length ? `с кадрами ${shot} из ${batches.length}` : 'партий нет'},
    styles: {done: state.styles.length > 0, started: state.styles.length > 0,
             note: state.styles.length ? `направлений ${state.styles.length}` : 'направлений нет'},
  };
}

function drawRail() {
  const book = state.books.find(b => b.slug === state.slug);
  const done = stages();
  document.getElementById('rail').innerHTML = `
    <div class="kicker">Книга</div>
    <div class="book">
      <div class="book-name">${esc(book ? book.title : '—')}</div>
      <div class="book-sub">${esc(book ? (book.author || '') : 'книг ещё нет')}</div>
    </div>
    <div class="kicker">Этапы</div>
    ${SCREENS.map(([key, name], n) => {
      const s = done[key];
      return `
      <button class="stage${s.done ? ' done' : ''}" data-go="${key}"${
        state.screen === key ? ' aria-current="step"' : ''}>
        <span class="mark${s.done ? '' : s.started ? ' part' : ''}" aria-hidden="true">${
          s.done ? '✓' : n + 1}</span>
        <span><span class="stage-name">${name}</span> <span class="stage-sub">${esc(s.note)}</span></span>
        <span class="sr">, этап ${n + 1} из ${SCREENS.length}, ${

      ${state.git ? (state.git.lines.length
        ? `<br>В дереве изменений: <b>${state.git.lines.length}</b>. Коммит — руками.`
        : '<br>Дерево чистое.') : ''}</div>`;
}

function auditStrip(audit, understanding) {
  if (!audit) return '<span class="tag wait">аудита нет</span>';
  const gaps = AUDIT_KEYS.filter(k => audit[k] !== 1).map(k => AUDIT_NAMES[k]);
  const label = `аудит ${understanding ?? '?'} из 10`
    + (gaps.length ? `; просели: ${gaps.join(', ')}` : '; все клетки полные');
  const cells = AUDIT_KEYS.map(k => {
    const v = audit[k];
    return `<span class="cell ${v === 1 ? 'full' : v === 0.5 ? 'half' : ''}"></span>`;
  }).join('');
  return `<div><span class="audit" role="img" aria-label="${esc(label)}" title="${esc(label)}">${cells}</span>`
       + `<span class="score">${understanding ?? '—'}</span></div>`
       + (gaps.length ? `<div class="gaps">просели: ${esc(gaps.join(', '))}</div>` : '');
}

function checkCell(complaints) {
  // «Не сходится» и «не хватает» — разные вещи. Первое чинят, второе дописывают; если красить
  // одинаково, экран краснеет весь и перестаёт что-либо сообщать.
  const wrong = complaints.filter(c => c.level !== 'missing');
  const gaps = complaints.filter(c => c.level === 'missing');
  const parts = [];
  if (wrong.length) parts.push(`<span class="tag bad">${wrong.length} не сходится</span>
      <div class="why">${wrong.map(c => esc(c.text)).join('<br>')}</div>`);
  if (gaps.length) {
    const fields = gaps.map(c => {
      const key = (c.text.match(/нет поля (\w+)/) || [])[1];
      return key ? (FIELD_NAMES[key] || key) : c.text;
    });
    parts.push(`<span class="tag wait" title="${esc(gaps.map(c => c.text).join('; '))}">не хватает: ${esc(fields.join(', '))}</span>`);
  }
  if (!parts.length) parts.push('<span class="tag ok">запись годна</span>');
  return parts.join(' ');
}

function eyebrow() {
  const book = state.books.find(b => b.slug === state.slug);
  return book ? `<div class="eyebrow">${esc(book.title)}${
    book.author ? ' · ' + esc(book.author) : ''}</div>` : '';
}

function screenCharacters() {
  const book = state.book;
  if (!book) return '<div class="empty">Книга не выбрана.</div>';

    const running = openEntryJob(c.key);
    return `<tr>
      <td><div class="who">

          ? `<a href="/file/${esc(c.sheet_file)}" target="_blank" title="открыть лист целиком"><img class="sheet" src="/file/${esc(c.sheet_file)}" alt="лист внешности: ${esc(c.name)}" loading="lazy" width="1536" height="1024"></a>`
          : '<span class="sheet-none">нет листа</span>'}

  }).join('');
  return `${eyebrow()}<h1>Персонажи</h1>

    «Не хватает» — поля, которых в записи нет: разбивка <code>audit</code> появилась позже

    <div class="step">
      <div class="step-head"><span class="num" aria-hidden="true">1</span>
        <div><h2>Библия и аудит</h2>
        <div class="step-sub">«Собрать запись» ставит задание Codex: он читает книгу через

      <div class="wide"><table>
        <thead><tr><th scope="col">Герой и лист</th><th scope="col">Аудит и балл</th>
          <th scope="col">Проверка</th><th scope="col"><span class="sr">Действие</span></th></tr></thead>

function whoStrip(keys) {
  const known = Object.fromEntries((state.book?.characters || []).map(c => [c.key, c]));
  return `<div class="whos">${keys.map(k => {
    const c = known[k];
    return `<figure>${c && c.sheet_file
      ? `<img src="/file/${esc(c.sheet_file)}" alt="лист внешности: ${esc(c.name)}" loading="lazy" width="1536" height="1024">`
      : '<span class="sheet-none" style="width:132px;height:88px">нет</span>'}
      <figcaption>${esc(c ? c.name : k)}</figcaption></figure>`;
  }).join('')}</div>`;
}

function styleName(key) {
  const found = state.styles.find(s => s.key === key);
  return found ? found.name : (key || '—');
}

function frameLabel(fr, differs) {
  // Партия-проба существует, чтобы сравнивать. Различие двух кадров нельзя оставлять
  // тире в служебной строке: его называют словами и в полный голос.
  const parts = [];
  if (differs.composition)
    parts.push(fr.composition ? `с шаблоном ${fr.composition}` : 'без шаблона композиции');
  if (differs.style) parts.push(styleName(fr.style));
  if (differs.refs) parts.push(`эталоны ${fr.style_refs.join(', ') || 'без эталонов'}`);
  return parts.join(' · ');
}

function sceneBlock(s) {
  const many = s.frames.length > 1;
  const vary = k => new Set(s.frames.map(fr => JSON.stringify(fr[k]))).size > 1;
  const differs = many
    ? {composition: vary('composition'), style: vary('style'), refs: vary('style_refs')}
    : {};
  const frames = s.frames.length
    ? s.frames.map(fr => {
        const label = many ? frameLabel(fr, differs) : '';
        return `<div class="frame">
        ${label ? `<div class="frame-label">${esc(label)}</div>` : ''}
        ${fr.image
          ? `<a href="/file/${esc(fr.image)}" target="_blank"><img src="/file/${esc(fr.image)}" alt="кадр: ${esc(s.title)}" loading="lazy" width="1536" height="1024"></a>`
          : '<div class="frame-none">кадра нет</div>'}
        <div class="under">${differs.style ? '' : `<span class="tag">${esc(styleName(fr.style))}</span>`}
          ${differs.composition ? '' : `<span>шаблон <code>${esc(fr.composition || '—')}</code></span>`}
          ${differs.refs ? '' : `<span>эталоны ${fr.style_refs.map(esc).join(', ') || '—'}</span>`}</div>
      </div>`; }).join('')
    : '<div class="frame-none">кадров ещё нет — есть только карточка</div>';
  const loc = s.locator
    ? `гл${s.locator.chapter} [${s.locator.paragraphs[0]}, ${s.locator.paragraphs[1]})` : '—';
  return `<div class="scene">
    <div class="frames">${frames}</div>
    <div>
      <h2>${esc(s.title)}</h2>
      <div class="cap">${esc(s.caption || '')}</div>
      <div class="meta"><span class="tag">${s.order ?? '—'} по порядку</span>
        <span class="tag mono" title="полуинтервал абзацев: правая граница не входит">${esc(loc)}</span>
        <span class="tag">по плану шаблон ${esc(s.composition || '—')}</span></div>
      ${s.brief ? `<div class="step-sub" style="max-width:none">${esc(s.brief)}</div>` : ''}
      ${s.invariants.length ? whoStrip(s.invariants) : ''}
      ${s.excerpt ? `<div class="excerpt"><div class="from">отрывок книги · ${esc(loc)}</div>${esc(s.excerpt)}</div>` : ''}
    </div>
  </div>`;
}

function screenBatches() {
  const book = state.book;
  if (!book) return '<div class="empty">Книга не выбрана.</div>';

  if (state.batch) {

  if (!book.batches.length) return `${eyebrow()}<h1>Партии</h1>

    создание из панели — вторая версия.</div>`;
  return `${eyebrow()}<h1>Партии</h1>
    <p class="lede">Партия — замысел серии: направление, отобранные сцены, карточки и кадры.
    Манифест пишется только по существующим кадрам.</p>

      <div class="card"><h2 class="name">${esc(b.name)}</h2>

        <div class="kv"><span>карточек <b>${b.cards}</b></span>
          <span>в манифесте <b>${b.scenes}</b></span>
          <span>план <b>${b.planned ? 'есть' : 'нет'}</b></span></div>
        <div class="actions"><button class="btn btn-sm" data-batch="${esc(b.name)}">Открыть</button></div>
      </div>`).join('')}</div>`;
}

function screenStyles() {
  if (!state.styles.length) return `<h1>Стили</h1>
    <div class="empty">Направлений нет. Они лежат в <code>styles/directions/*.json</code>,

  return `<h1>Стили</h1>
    <p class="lede">Направление держит манеру и тональный ключ. Эталоны собственной генерации:
    собранные со свободных источников картинки нужной манеры не дают. Направление выбирают

    <div class="styles-list">${state.styles.map(s => `
      <div class="card">
        <div class="style-head">
          <div><h2 class="name">${esc(s.name)}</h2>
            <div class="sub"><code>${esc(s.key)}</code> · эталонов ${s.refs.length}</div></div>
          <div class="notes" lang="en">${esc(clip(s.palette_en, 320))}</div>
        </div>
        <div class="refs">${s.refs.map(r =>
          `<a href="/file/${esc(r.file)}" target="_blank" title="${esc(r.id)}${r.why ? ' — ' + esc(r.why) : ''}"><img src="/file/${esc(r.file)}" alt="эталон ${esc(r.id)} направления «${esc(s.name)}»" loading="lazy" width="1536" height="1024"></a>`).join('')}</div>
      </div>`).join('')}</div>`;
}

function draw() {
  drawTabs();
  drawRail();
  const work = document.getElementById('work');
  if (!state.ready) { work.innerHTML = '<div class="skeleton">Читаю репозиторий…</div>'; return; }
  const body = {books: screenBooks, characters: screenCharacters,
                batches: screenBatches, styles: screenStyles}[state.screen]();
  const wide = state.wideLog ? `
    <div class="step">
      <div class="step-head"><span class="num" aria-hidden="true">⌄</span>
        <div><h2>Лог задания</h2>
        <div class="step-sub mono">${esc(state.wideLog)}</div></div></div>
      <div class="log wide-log" id="log-${esc(state.wideLog)}" tabindex="0" role="region"
           aria-label="Лог задания ${esc(state.wideLog)}">загрузка…</div>
      <div class="actions"><button class="btn btn-sm" data-log="${esc(state.wideLog)}">Свернуть</button></div>
    </div>` : '';
  work.innerHTML = (state.error
      ? `<div class="err"><span>${esc(state.error)}</span><button class="btn btn-sm" data-dismiss="">Скрыть</button></div>`
      : '') + body + wide;
  if (state.wideLog) {
    showLog(state.wideLog);
    // Иначе «Развернуть» выглядит как кнопка, которая ничего не сделала: лог оказывается
    // под всей таблицей, вне экрана.
    const box = document.getElementById('log-' + state.wideLog);
    if (box) box.scrollIntoView({block: 'center'});
  }
}

let jobsShape = null;

function drawJobs() {
  const box = document.getElementById('jobs');
  // Пересобирать разметку каждые две секунды нельзя: открытый лог при этом уничтожается и
  // рождается заново — он мигает и теряет прокрутку. Разметку трогаем, только когда
  // изменился сам состав очереди; текст лога и часы обновляем на месте.
  // Имя героя приходит вместе с книгой, позже первой отрисовки очереди: без него в
  // сигнатуре карточки навсегда остались бы с ключом вместо имени.
  const shape = JSON.stringify([state.openLog, state.wideLog, state.total, state.showAll,
                                state.jobs.map(j => [j.id, j.status, j.error, jobSubject(j)])]);
  if (shape === jobsShape) { if (state.openLog) showLog(state.openLog); return; }
  jobsShape = shape;
  // Состав очереди меняется и когда задание просто дошло до конца. Перенесём в новую
  // разметку то, что уже прочитано, — иначе на смене статуса лог мигнёт «загрузкой».
  const open = state.openLog ? document.getElementById('log-' + state.openLog) : null;
  const kept = open ? {text: open.textContent, top: open.scrollTop} : null;
  if (!state.jobs.length) {
    box.innerHTML = `<div class="empty">Пока пусто. Задания появляются здесь, когда вы
      нажимаете кнопку на экране этапа: панель показывает ход, лог и даёт снять задание.</div>`;
    return;
  }
  // Очередь — не журнал. По умолчанию видно то, что идёт, и последние пять законченных;
  // остальное — по требованию, а ненужное можно забыть совсем.
  const live = state.jobs.filter(j => OPEN.includes(j.status));
  const past = state.jobs.filter(j => !OPEN.includes(j.status));
  const shown = state.showAll ? state.jobs : live.concat(past.slice(0, 5));
  let place = 0;
  box.innerHTML = shown.map(j => {
    if (j.status === 'queued') place += 1;
    const subject = jobSubject(j);
    return `
    <div class="job${j.status === 'running' ? ' now' : ''}">
      <div class="job-top">
        <span class="job-kind">${esc(subject || KIND_NAMES[j.kind] || j.kind)}</span>
        <span class="tag ${STATUS_TAGS[j.status] || ''}">${esc(STATUS_NAMES[j.status] || j.status)}</span>
      </div>
      ${subject ? `<div class="job-what">${esc(KIND_NAMES[j.kind] || j.kind)}</div>` : ''}
      ${spent(j, j.status === 'queued' ? place : 0)}
      ${j.error ? `<div class="why${STATUS_TAGS[j.status] === 'bad' ? '' : ' quiet'}">${
        esc(j.error)}</div>` : ''}
      <div class="job-id">${esc(j.id)}</div>
      <div class="actions">
        <button class="btn btn-sm" data-log="${esc(j.id)}">${
          state.openLog === j.id ? 'Скрыть лог'
          : state.wideLog === j.id ? 'Свернуть лог' : 'Лог'}</button>
        ${state.openLog === j.id
          ? `<button class="btn btn-sm" data-wide="${esc(j.id)}">Развернуть</button>` : ''}
        ${OPEN.includes(j.status)
          ? `<button class="btn btn-sm" data-cancel="${esc(j.id)}">Снять</button>` : ''}
        ${['failed', 'interrupted'].includes(j.status) && j.kind === 'bible-entry' && j.args
          ? `<button class="btn btn-sm" data-again="${esc(j.args.key)}">Собрать заново</button>` : ''}
      </div>
      ${state.openLog === j.id
          ? `<div class="log" id="log-${esc(j.id)}" tabindex="0" role="region"
                  aria-label="Лог задания ${esc(j.id)}">${esc(kept ? kept.text : 'загрузка…')}</div>`
          : ''}
    </div>`; }).join('');
  const hidden = state.total - shown.length;
  box.insertAdjacentHTML('beforeend', `<div class="queue-foot">
    ${hidden > 0 ? `<button class="btn btn-sm" data-more="">Показать все (${state.total})</button>`
      : state.showAll && state.total > live.length + 5
        ? '<button class="btn btn-sm" data-more="">Свернуть</button>' : ''}
    ${past.length ? '<button class="btn btn-sm" data-forget="">Убрать законченные</button>' : ''}
  </div>`);
  if (kept) {
    const fresh = document.getElementById('log-' + state.openLog);
    if (fresh) fresh.scrollTop = kept.top;
  }
  if (state.openLog) showLog(state.openLog);
}

async function showLog(id) {
  const box = document.getElementById('log-' + id);
  if (!box) return;
  try {
    const data = await api(`/api/jobs/${encodeURIComponent(id)}/log?tail=200`);
    const text = data.log || '(лог пуст)';
    if (box.textContent === text) return;
    // Догоняем хвост, только если человек и так смотрел в конец: иначе чтение середины
    // лога у бегущего задания невозможно — его каждый раз уносило бы вниз.
    const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
    box.textContent = text;
    if (atEnd) box.scrollTop = box.scrollHeight;
  } catch (error) { /* задание могло исчезнуть */ }
}

async function startEntry(key, button) {
  if (button) button.disabled = true;
  try {
    // Имя из книги и подсказки индекса выводит сервер: в браузере лежит русское имя
    // из библии, а по английскому тексту оно ничего не найдёт.
    await api(`/api/books/${encodeURIComponent(state.slug)}/bible/${encodeURIComponent(key)}`,
              {method: 'POST', body: '{}'});
  } catch (error) { state.error = error.message; }
  // Кнопка не рассказывает свою версию событий: её состояние берётся из очереди.
  await pollJobs();
  schedulePoll();
  draw();
}

document.addEventListener('click', async event => {
  const target = event.target.closest('[data-go],[data-book],[data-batch],[data-entry],'
    + '[data-log],[data-wide],[data-cancel],[data-again],[data-dismiss],[data-more],[data-forget]');
  if (!target) return;
  const d = target.dataset;
  if (d.go) return go(d.go);
  if (d.book) { state.slug = d.book; return go('characters'); }
  if (d.batch !== undefined) return d.batch ? openBatch(d.batch) : go('batches');
  if (d.dismiss !== undefined) { state.error = null; return draw(); }
  if (d.log) {
    if (state.wideLog === d.log) { state.wideLog = null; state.openLog = null; }
    else state.openLog = state.openLog === d.log ? null : d.log;
    drawJobs();
    return draw();
  }
  if (d.wide) { state.wideLog = d.wide; state.openLog = null; drawJobs(); return draw(); }
  if (d.more !== undefined) { state.showAll = !state.showAll; return drawJobs(); }
  if (d.forget !== undefined) {
    await api('/api/jobs/clear', {method: 'POST'});
    state.showAll = false;
    state.openLog = state.wideLog = null;
    await pollJobs();
    return draw();
  }
  if (d.cancel) { await api(`/api/jobs/${encodeURIComponent(d.cancel)}/cancel`, {method: 'POST'}); return pollJobs(); }
  if (d.again) return startEntry(d.again, target);
  if (d.entry) return startEntry(d.entry, target);
});

// Две секунды нужны, только пока что-то идёт. В покое это 1800 лишних запросов в час.
let pollTimer = null;

function schedulePoll() {
  clearTimeout(pollTimer);
  const busy = state.jobs.some(j => OPEN.includes(j.status));
  pollTimer = setTimeout(async () => { await pollJobs(); schedulePoll(); },
                         document.hidden ? 15000 : busy ? 2000 : 8000);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { pollJobs().then(schedulePoll); }
});
window.addEventListener('hashchange', () => applyHash(false));

draw();
if (!location.hash) location.hash = '#/books';
applyHash(true);
pollJobs().then(schedulePoll);
setInterval(() => { if (state.jobs.some(j => j.status === 'running')) tick(); }, 1000);
</script>
</body>
</html>
