        <button class="btn btn-sm" data-log="${esc(j.id)}">${
          state.openLog === j.id ? 'Скрыть лог'
          : state.wideLog === j.id ? 'Свернуть лог' : 'Лог'}</button>
        ${state.openLog === j.id
          ? `<button class="btn btn-sm" data-wide="${esc(j.id)}">Развернуть</button>` : ''}
        ${OPEN.includes(j.status)
          ? `<button class="btn btn-sm" data-cancel="${esc(j.id)}">Снять</button>` : ''}
        ${['failed', 'interrupted'].includes(j.status) && j.args && j.args.key
          && ['bible-entry', 'bible-refine'].includes(j.kind)
          ? `<button class="btn btn-sm" data-${j.kind === 'bible-refine' ? 'refine' : 'again'}="${
              esc(j.args.key)}">${j.kind === 'bible-refine' ? 'Добрать заново'
                                                            : 'Собрать заново'}</button>` : ''}
      </div>
      ${state.openLog === j.id
          ? `<div class="log" id="log-${esc(j.id)}" tabindex="0" role="region"
                  aria-label="Лог задания ${esc(j.id)}">${esc(kept ? kept.text : 'загрузка…')}</div>`
          : ''}
    </div>`; }).join('');
  const hidden = state.total - shown.length;
  box.insertAdjacentHTML('beforeend', `<div class="queue-foot">
    ${hidden > 0 ? `<button class="btn btn-sm" data-more="">Показать все (${state.total})</button>`
      : state.showAll && state.total > live.length + 5
        ? '<button class="btn btn-sm" data-more="">Свернуть</button>' : ''}
    ${past.length ? '<button class="btn btn-sm" data-forget="">Убрать законченные</button>' : ''}
  </div>`);
  if (kept) {
    const fresh = document.getElementById('log-' + state.openLog);
    if (fresh) fresh.scrollTop = kept.top;
  }
  if (state.openLog) showLog(state.openLog);
}

async function showLog(id) {
  const box = document.getElementById('log-' + id);
  if (!box) return;
  try {
    const data = await api(`/api/jobs/${encodeURIComponent(id)}/log?tail=200`);
    const text = data.log || '(лог пуст)';
    if (box.textContent === text) return;
    // Догоняем хвост, только если человек и так смотрел в конец: иначе чтение середины
    // лога у бегущего задания невозможно — его каждый раз уносило бы вниз.
    const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
    box.textContent = text;
    if (atEnd) box.scrollTop = box.scrollHeight;
  } catch (error) { /* задание могло исчезнуть */ }
}

async function startEntry(key, button) {
  if (button) button.disabled = true;
  try {
    // Имя из книги и подсказки индекса выводит сервер: в браузере лежит русское имя
    // из библии, а по английскому тексту оно ничего не найдёт.
    await api(`/api/books/${encodeURIComponent(state.slug)}/bible/${encodeURIComponent(key)}`,
              {method: 'POST', body: '{}'});
  } catch (error) { state.error = error.message; }
  // Кнопка не рассказывает свою версию событий: её состояние берётся из очереди.
  await pollJobs();
  schedulePoll();
  draw();
}

async function startSheet(key, button) {
  if (button) button.disabled = true;
  try {
    await api(`/api/books/${encodeURIComponent(state.slug)}/sheets/${encodeURIComponent(key)}`,
              {method: 'POST', body: '{}'});
  } catch (error) { state.error = error.message; }
  await pollJobs();
  schedulePoll();
  draw();
}

function drawBody(card) {
  const refs = (state.draw.refs || '').split(/[\s,]+/).filter(Boolean);
  return {card, style: state.draw.style || state.batch.style || (state.styles[0] || {}).key,
          refs: refs.length ? refs : null, composition: state.draw.composition !== false};
}

async function startFrame(card, button) {
  const path = `/api/books/${encodeURIComponent(state.slug)}/batches/${
    encodeURIComponent(state.batch.name)}/frames`;
  return post(path, drawBody(card), button);
}

async function startAllFrames(button) {
  // Задания идут по одному, поэтому «нарисовать недостающие» — это просто очередь целиком.
  const cards = state.batch.scenes.filter(s => !s.frames.some(fr => fr.image));
  if (button) button.disabled = true;
  const path = `/api/books/${encodeURIComponent(state.slug)}/batches/${
    encodeURIComponent(state.batch.name)}/frames`;
  for (const scene of cards) {
    try { await api(path, {method: 'POST', body: JSON.stringify(drawBody(scene.id))}); }
    catch (error) { state.error = error.message; break; }
  }
  await pollJobs();
  schedulePoll();
  await load();
}

async function checkBatch(button) {
  if (button) { button.disabled = true; button.textContent = 'сверяю…'; }
  try {
    const answer = await api(`/api/books/${encodeURIComponent(state.slug)}/batches/${
      encodeURIComponent(state.batch.name)}/check`);
    state.checked = {...answer, batch: state.batch.name};
  } catch (error) { state.error = error.message; }
  draw();
}

async function post(path, body, button) {
  // Единственный путь для кнопок, ставящих задание: отключить, послать, перечитать очередь.
  // Своей версии событий кнопка не рассказывает — её состояние приходит из очереди.
  if (button) button.disabled = true;
  try {
    await api(path, {method: 'POST', body: JSON.stringify(body || {})});
  } catch (error) { state.error = error.message; }
  await pollJobs();
  schedulePoll();
  await load();
}

async function sheetVerdict(key, verdict, button) {
  if (button) button.disabled = true;
  try {
    await api(`/api/books/${encodeURIComponent(state.slug)}/sheets/${
      encodeURIComponent(key)}/${verdict}`, {method: 'POST', body: '{}'});
  } catch (error) { state.error = error.message; }
  await load();
}

const FORMS = {
  newbook: async data => {
    const file = data.file;
    if (!file || !file.size) throw new Error('выберите файл книги');
    if (file.size > 40 * 1024 * 1024) throw new Error('файл больше 40 МБ');
    // Файл уже на сервере, если по нему заполняли форму: шлём только его имя.
    const body = {...data, file: undefined, filename: file.name,
                  year: data.year ? Number(data.year) : null,
                  numbered_only: !!data.numbered_only};
    if (!data.staged) body.data = await base64(file);
    return ['/api/books', body];
  },
  newbatch: async data => [`/api/books/${encodeURIComponent(state.slug)}/batches`, data],
  newcard: async data => [`/api/books/${encodeURIComponent(state.slug)}/batches/${
    encodeURIComponent(state.batch.name)}/cards`, data],
};

document.addEventListener('submit', async event => {
  const form = event.target;
  if (!FORMS[form.id]) return;
  event.preventDefault();
  const button = form.querySelector('button[type=submit]');
  const data = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    data[el.name] = el.type === 'checkbox' ? el.checked
                  : el.type === 'file' ? (el.files[0] || null)
                  : el.value.trim();
  }
  if (button) { button.disabled = true; button.dataset.was = button.textContent;
                button.textContent = 'отправляю…'; }
  try {
    const [path, body] = await FORMS[form.id](data);
    await api(path, {method: 'POST', body: JSON.stringify(body)});
    form.reset();
  } catch (error) {
    state.error = error.message;
  } finally {
    if (button) { button.disabled = false; button.textContent = button.dataset.was; }
  }
  await pollJobs();
  schedulePoll();
  await load();
});

async function base64(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  // По кускам: у книги в 20 МБ разворачивание массива в аргументы переполняет стек.
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}

const META_FIELDS = {title: 'название', author: 'автор', translator: 'перевод',
                     edition: 'издание', year_published: 'год', slug: 'слаг'};

async function readBook(input) {
  // Книга знает о себе название, автора, переводчика и год. Человеку остаётся сверить
  // прочитанное и решить вопрос о правах — переписывать метаданные руками незачем.
  const form = input.closest('form');
  const said = document.getElementById('fromfile');
  const file = input.files[0];
  if (!form || !said) return;
  if (!file) { said.hidden = true; return; }
  said.hidden = false;
  said.textContent = 'читаю, что книга знает о себе…';
  try {
    const meta = await api('/api/books/meta', {method: 'POST', body: JSON.stringify(
      {filename: file.name, data: await base64(file)})});
    const filled = [];
    for (const [key, name] of Object.entries(META_FIELDS)) {
      const field = form.elements[key === 'year_published' ? 'year' : key];
      if (!field || !meta[key]) continue;
      field.value = meta[key];
      filled.push(name);
    }
    form.elements.staged.value = meta.staged || '';
    said.textContent = filled.length
      ? `Из файла: ${filled.join(', ')}. Проверьте и укажите права.`
      : 'Файл о себе ничего не говорит — заполните поля сами.';
  } catch (error) {
    said.textContent = `метаданные не прочитались: ${error.message}. Заполните поля сами.`;
  }
}

document.addEventListener('change', event => {
  if (event.target.type === 'file') {
    const shown = event.target.closest('.file').querySelector('.file-name');
    const file = event.target.files[0];
    shown.textContent = file
      ? `${file.name} · ${(file.size / 1024 / 1024).toFixed(1)} МБ`
      : 'fb2, epub или txt — файл не выбран';
    if (event.target.id === 'bookfile') readBook(event.target);
    return;
  }
  const key = event.target.dataset && event.target.dataset.draw;
  if (!key) return;
  state.draw[key] = event.target.type === 'checkbox' ? event.target.checked : event.target.value;
});

// Список действий один на всю панель: перечень селекторов, набранный руками, молча
// перестаёт ловить новые кнопки — так уже случилось с половиной кнопок цепочки.
const ACTIONS = ['go', 'book', 'pick', 'operator', 'jobs', 'batch', 'entry', 'refine', 'again', 'log',
                 'wide', 'cancel', 'dismiss', 'history', 'record', 'restore',
                 'more', 'forget', 'sheet', 'accept', 'reject', 'parse', 'index', 'frame',
                 'framesAll', 'checkBatch', 'registerBatch', 'found', 'moreFound'];
const ACTION_SELECTOR = ACTIONS
  .map(name => `[data-${name.replace(/[A-Z]/g, up => '-' + up.toLowerCase())}]`).join(',');

document.addEventListener('click', async event => {
  const target = event.target.closest(ACTION_SELECTOR);
  if (!target) return;
  const d = target.dataset;
  if (d.go) return go(d.go);
  if (d.book) return go('characters', d.book);
  if (d.pick) {
    // Смена книги экран не меняет: человек смотрел партии — пусть смотрит партии другой
    // книги, а не возвращается к началу.
    if (d.pick === state.slug) return;
    state.batch = null;
    return go(state.screen === 'books' ? 'characters' : state.screen, d.pick);
  }
  if (d.jobs) {
    if (Number(d.jobs) === (state.settings || {}).jobs) return;
    try {
      state.settings = await api('/api/settings',
          {method: 'POST', body: JSON.stringify({jobs: Number(d.jobs)})});
    } catch (error) { state.error = `ширина не сменилась: ${error.message}`; }
    return draw();
  }
  if (d.operator) {
    if (d.operator === (state.settings || {}).operator) return;
    try {
      state.settings = await api('/api/settings',
          {method: 'POST', body: JSON.stringify({operator: d.operator})});
    } catch (error) { state.error = `оператор не сменился: ${error.message}`; }
    return draw();
  }
  if (d.batch !== undefined) return d.batch ? openBatch(d.batch) : go('batches');
  if (d.dismiss !== undefined) { state.error = null; return draw(); }
  if (d.log) {
    if (state.wideLog === d.log) { state.wideLog = null; state.openLog = null; }
    else state.openLog = state.openLog === d.log ? null : d.log;
    drawJobs();
    return draw();
  }
  if (d.wide) { state.wideLog = d.wide; state.openLog = null; drawJobs(); return draw(); }
  if (d.more !== undefined) {
    state.showAll = !state.showAll;
    await pollJobs();                 // за остальными заданиями надо сходить на сервер
    return drawJobs();
  }
  if (d.forget !== undefined) {
    await api('/api/jobs/clear', {method: 'POST'});
    state.showAll = false;
    state.openLog = state.wideLog = null;
    await pollJobs();
    return draw();
  }
  if (d.cancel) { await api(`/api/jobs/${encodeURIComponent(d.cancel)}/cancel`, {method: 'POST'}); return pollJobs(); }
  if (d.again) return startEntry(d.again, target);
  if (d.entry) return startEntry(d.entry, target);
  if (d.refine) return post(`/api/books/${encodeURIComponent(state.slug)}/bible/${
    encodeURIComponent(d.refine)}/refine`, {}, target);
  if (d.moreFound !== undefined) { state.showFound = !state.showFound; return draw(); }
  if (d.found) return post(`/api/books/${encodeURIComponent(state.slug)}/bible/${
    encodeURIComponent(d.key)}`, {name: d.found}, target);
  if (d.sheet) return startSheet(d.sheet, target);
  if (d.parse) return post(`/api/books/${encodeURIComponent(d.parse)}/parse`, {}, target);
  if (d.index) return post(`/api/books/${encodeURIComponent(d.index)}/index`, {}, target);
  if (d.frame) return startFrame(d.frame, target);
  if (d.framesAll !== undefined) return startAllFrames(target);
  if (d.checkBatch !== undefined) return checkBatch(target);
  if (d.registerBatch !== undefined) {
    const dropped = (state.checked || {}).dropped || 0;
    // Перезапись выбрасывает из манифеста всё, что не сошлось, и переписывает README.
    // Число говорится вслух до нажатия, а не после.
    if (dropped && !confirm(`Из манифеста будут убраны записи: ${dropped}. `
        + 'README и галерея будут переписаны. Кадры на диске останутся. Продолжить?')) return;
    return post(`/api/books/${encodeURIComponent(state.slug)}/batches/${
      encodeURIComponent(state.batch.name)}/register`, {}, target);
  }
  if (d.record) {
    state.openRecord = state.openRecord === d.record ? null : d.record;
    return draw();
  }
  if (d.history) {
    state.openHistory = state.openHistory === d.history ? null : d.history;
    return draw();
  }
  if (d.restore) return post(`/api/books/${encodeURIComponent(state.slug)}/sheets/${
    encodeURIComponent(d.restore)}/restore`, {file: d.file}, target);
  if (d.accept) return sheetVerdict(d.accept, 'accept', target);
  if (d.reject) return sheetVerdict(d.reject, 'reject', target);
});

// Две секунды нужны, только пока что-то идёт. В покое это 1800 лишних запросов в час.
let pollTimer = null;

function schedulePoll() {
  clearTimeout(pollTimer);
  const busy = state.jobs.some(j => OPEN.includes(j.status));
  pollTimer = setTimeout(async () => { await pollJobs(); schedulePoll(); },
                         document.hidden ? 15000 : busy ? 2000 : 8000);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { pollJobs().then(schedulePoll); }
});
window.addEventListener('hashchange', () => applyHash(false));

draw();
if (!location.hash) location.hash = '#/books';
applyHash(true);
pollJobs().then(schedulePoll);
setInterval(() => { if (state.jobs.some(j => j.status === 'running')) tick(); }, 1000);
</script>
</body>
</html>
